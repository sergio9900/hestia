name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decodificar keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compilar APK firmado
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk

      - name: Avisar en Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEVLOG }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\": \"🚀 **Hestia ${TAG}** publicada → https://github.com/${REPO}/releases/tag/${TAG}\"}" \
            "$WEBHOOK"
