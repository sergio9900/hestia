name: Documentación de la base de datos

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/ci/**"
      - "tbls.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: db-docs
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hestia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hestia_ci

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DOCS_PUSH_TOKEN }}

      - name: Aplicar migraciones
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/ci/bootstrap.sql
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "Aplicando $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - uses: k1low/setup-tbls@v1

      - name: Generar documentación
        run: tbls doc --rm-dist

      - name: Guardar cambios
        run: |
          if [ -n "$(git status --porcelain docs/database)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/database
            git commit -m "docs(db): actualizar documentación del esquema"
            git push
          else
            echo "La documentación ya está al día"
          fi
