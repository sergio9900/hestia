name: Bug
description: Reportar un fallo
labels: [bug]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: ¿Qué ocurre?
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
  - type: input
    id: version
    attributes:
      label: Versión de la app
      placeholder: "0.1.1"
